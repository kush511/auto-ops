name: CI

on: [push]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      - name: Create cluster
        run: kind create cluster --name auto-ops

      - name: Build and load images
        run: |
          docker build -t auto-ops-app:latest ./app
          docker build -t auto-ops-agent:latest ./agent
          kind load docker-image auto-ops-app:latest --name auto-ops
          kind load docker-image auto-ops-agent:latest --name auto-ops

      - name: Install Sealed Secrets CRD
        run: |
          kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.25.0/controller.yaml
          # Wait for the controller to be ready
          kubectl rollout status deployment/sealed-secrets-controller -n kube-system --timeout=120s


      - name: Debug cluster state
        run: |
          echo "=== All resources in default namespace ==="
          kubectl get all -n default
          echo "=== All services ==="
          kubectl get svc -A
          echo "=== All pods ==="
          kubectl get pods -A
          echo "=== Applied manifests ==="
          ls -la ops/
          echo "=== Any errors in pod events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -20
      - name: Create secret
        env:
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
        run: |
          kubectl create secret generic inception-secret \
            --from-literal=api-key=$INCEPTION_API_KEY

      - name: Deploy stack
        run: |
          for f in ops/*.yaml; do
            case "$f" in
              *grafana-values.yaml|*prometheus-values.yaml) ;; # skip values files
              *sealed-secret*) ;; # skip sealed-secret.yaml, secret made above
              *) kubectl apply -f "$f";;
            esac
          done
          kubectl rollout status deployment/app-deployment --timeout=120s
          kubectl rollout status deployment/agent-deployment --timeout=120s

      - name: Smoke test
        run: |
          set -euo pipefail
          # Wait for app-service to exist
          for i in {1..30}; do
            if kubectl get svc app-service >/dev/null 2>&1; then
              echo "app-service found"; break
            fi
            echo "Waiting for app-service... ($i)"; sleep 2
            if [ "$i" -eq 30 ]; then echo "app-service not found after 60s"; exit 1; fi
          done
          # Wait for app deployment to be available
          kubectl rollout status deployment/app-deployment --timeout=120s
          # Port-forward and test
          kubectl port-forward svc/app-service 3000:3000 &
          PF_PID=$!
          sleep 5
          curl -f http://localhost:3000/chaos/errors?duration=30
          kill $PF_PID

      - name: Tear down
        if: always()
        run: kind delete cluster --name auto-ops
