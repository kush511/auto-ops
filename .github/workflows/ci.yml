name: CI

on: [push]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install kind
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          kind version

      # Create cluster
      - name: Create cluster
        run: |
          kind create cluster --name auto-ops --wait 60s
          kubectl cluster-info
          kubectl get nodes

      # Build and load images
      - name: Build and load images
        run: |
          docker build -t auto-ops-app:latest ./app
          docker build -t auto-ops-agent:latest ./agent
          kind load docker-image auto-ops-app:latest --name auto-ops
          kind load docker-image auto-ops-agent:latest --name auto-ops
          echo "Images loaded:"
          docker images | grep auto-ops

      # Install Sealed Secrets controller
      - name: Install Sealed Secrets controller
        run: |
          kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.25.0/controller.yaml
          kubectl rollout status deployment/sealed-secrets-controller \
            -n kube-system --timeout=120s

      # Create the API key secret before deployments
      - name: Create inception secret
        env:
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
        run: |
          kubectl create secret generic inception-secret \
            --from-literal=api-key="$INCEPTION_API_KEY"
          echo "Secret created:"
          kubectl get secret inception-secret

      # Apply manifests in safe order
      - name: Deploy stack
        run: |
          echo "--- RBAC ---"
          kubectl apply -f ops/agent-rbac.yml

          echo "--- ConfigMaps ---"
          kubectl apply -f ops/runbook-configmap.yml

          echo "--- PVC ---"
          kubectl apply -f ops/audit-pvc.yml

          echo "--- App deployment ---"
          kubectl apply -f ops/app-deployment.yml

          echo "--- Agent deployment ---"
          kubectl apply -f ops/agent-deployment.yml

          echo "--- Dashboard deployment ---"
          kubectl apply -f ops/dashboard-deployment.yml

          echo "--- Services ---"
          kubectl apply -f ops/agent-callback-service.yaml

          echo "--- HPA (must come after app-deployment exists) ---"
          kubectl apply -f ops/app-hpa.yml

          echo "--- All resources applied ---"
          kubectl get all -n default

      # Wait for deployments to be ready
      - name: Wait for deployments
        run: |
          echo "Waiting for app-deployment..."
          kubectl rollout status deployment/app-deployment --timeout=180s

          echo "Waiting for agent-deployment..."
          kubectl rollout status deployment/agent-deployment --timeout=180s

          echo "Waiting for dashboard-deployment..."
          kubectl rollout status deployment/dashboard-deployment --timeout=120s || \
            echo "Dashboard not ready (non-fatal, continuing)"

          echo "Final pod state:"
          kubectl get pods -A

      # Smoke test
      - name: Smoke test
        run: |
          set -euo pipefail

          echo "Checking app-service..."
          kubectl get svc app-service

          kubectl port-forward svc/app-service 3000:3000 &
          PF_PID=$!
          sleep 5

          echo "Health check..."
          curl -f --retry 5 --retry-delay 3 http://localhost:3000/health

          # Trigger chaos for 60 seconds
          echo "Triggering chaos..."
          curl -f "http://localhost:3000/chaos/errors?duration=60"

          # Wait for agent to detect, decide, and remediate
          echo "Waiting 120s for agent to detect, decide, and remediate..."
          sleep 120

          kill $PF_PID || true

          # Verify agent actually took a restart action
          echo "Checking agent made a restart decision..."
          RESTART_FOUND=$(kubectl logs deployment/agent-deployment -c agent --tail=100 | \
            grep -c "restart\|Restarting\|rollout restart" || true)

          if [ "$RESTART_FOUND" -gt 0 ]; then
            echo " Agent took restart action"
          else
            echo " No restart found in agent logs — showing full decision log:"
            kubectl logs deployment/agent-deployment -c agent --tail=100
            # Don't fail CI here if no restart found
          fi

          echo "Final rollout status..."
          kubectl rollout status deployment/app-deployment --timeout=60s

          echo "Agent last 50 lines:"
          kubectl logs deployment/agent-deployment -c agent --tail=50

      # Always tear down
      - name: Tear down
        if: always()
        run: kind delete cluster --name auto-ops