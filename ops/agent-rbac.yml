apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]

  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "list", "update", "patch"]

  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]       # pods/log is a subresource, separate entry needed
    resources: ["pods/log"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-binding
subjects:
  - kind: ServiceAccount
    name: agent-sa
roleRef:
  kind: Role
  name: agent-role
  apiGroup: rbac.authorization.k8s.io