apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent-sa
      automountServiceAccountToken: true
      volumes:
        - name: audit-volume
          persistentVolumeClaim:
            claimName: audit-pvc
        - name: runbook-volume
          configMap:
            name: agent-runbook
        - name: heartbeat-volume
          emptyDir: {}
      containers:
        - name: agent
          image: auto-ops-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: callback
              protocol: TCP
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /tmp/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - name: in-cluster
                cluster:
                  server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              users:
              - name: agent
                user:
                  token: $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              contexts:
              - name: in-cluster
                context:
                  cluster: in-cluster
                  user: agent
                  namespace: ${K8S_NAMESPACE:-default}
              current-context: in-cluster
              EOF
              export KUBECONFIG=/tmp/kubeconfig
              exec node src/core/index.js
          volumeMounts:
            - name: audit-volume
              mountPath: /agent/audit
            - name: runbook-volume
              mountPath: /etc/agent/runbook
            - name: heartbeat-volume
              mountPath: /agent/heartbeat
          env:
            - name: INCEPTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inception-secret
                  key: api-key
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: inception-secret
                  key: slack-webhook-url
                  optional: true
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: inception-secret
                  key: slack-signing-secret
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inception-secret
                  key: slack-bot-token
                  optional: true
            - name: DEPLOYMENTS
              value: "app-deployment"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CHECK_INTERVAL
              value: "45000"
            - name: ACTION_COOLDOWN_MS
              value: "120000"
            - name: AUDIT_LOG_PATH
              value: "/agent/audit/actions.jsonl"
            - name: RUNBOOK_PATH
              value: "/etc/agent/runbook/runbook.md"
            - name: HEALTHY_CYCLE_THRESHOLD
              value: "3"
            - name: LOW_CONFIDENCE_LOG_PATH
              value: "/agent/audit/low-confidence.jsonl"
            - name: LOW_CONFIDENCE_THRESHOLD
              value: "0.6"
            - name: HEARTBEAT_PATH
              value: "/agent/heartbeat/timestamp.txt"
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local.:9090"
            - name: CALLBACK_PORT
              value: "3001"
            - name: APPROVAL_LOG_PATH
              value: "/agent/audit/approvals.jsonl"
            - name: APPROVAL_TIMEOUT_MS
              value: "300000"
        - name: watchdog
          image: auto-ops-agent:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: heartbeat-volume
              mountPath: /agent/heartbeat
          env:
            - name: HEARTBEAT_PATH
              value: "/agent/heartbeat/timestamp.txt"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: inception-secret
                  key: slack-webhook-url
                  optional: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"